name: Build Bodycam Recoil Control

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract addon source
        shell: bash
        run: |
          if [ ! -f "BodycamRecoilControl-Source.zip" ]; then
            echo "错误：找不到 BodycamRecoilControl-Source.zip"
            exit 1
          fi

          mkdir -p addon-src
          unzip -q BodycamRecoilControl-Source.zip -d addon-src

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          BUILD_FILE=$(find addon-src -name build.gradle -o -name build.gradle.kts | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "错误：没有找到 build.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Forge addon
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: Bodycam-Recoil-Control-Forge-1.20.1
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
