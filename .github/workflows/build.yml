name: Build BodycamRealisticRecoil

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source ZIP
        run: |
          ZIP_FILE="./BodycamRealisticRecoil-Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "找不到完整源码 ZIP"
            exit 1
          fi

          mkdir -p workspace
          unzip -q "$ZIP_FILE" -d workspace

      - name: Locate Gradle project
        run: |
          BUILD_FILE=$(find workspace -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "找不到 build.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Patch Mixin to avoid Args$1
        run: |
          mkdir -p "$PROJECT_DIR/src/main/java/com/jialen/bodycamrecoil/mixin"
          cat > "$PROJECT_DIR/src/main/java/com/jialen/bodycamrecoil/mixin/AbstractGunItemMixin.java" <<'JAVA'
          package com.jialen.bodycamrecoil.mixin;

          import com.jialen.bodycamrecoil.recoil.RecoilManager;
          import com.jialen.bodycamrecoil.recoil.RecoilState;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.projectile.Projectile;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Pseudo;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Redirect;

          @Pseudo
          @Mixin(targets = "com.tacz.guns.api.item.gun.AbstractGunItem")
          public abstract class AbstractGunItemMixin {
              @Redirect(
                      method = "doBulletSpread",
                      remap = false,
                      at = @At(
                              value = "INVOKE",
                              target = "Lnet/minecraft/world/entity/projectile/Projectile;shootFromRotation(Lnet/minecraft/world/entity/Entity;FFFFF)V",
                              remap = true
                      )
              )
              private void bodycam$applyRealProjectileRecoil(
                      Projectile projectile,
                      Entity shooter,
                      float pitch,
                      float yaw,
                      float roll,
                      float velocity,
                      float inaccuracy
              ) {
                  if (shooter instanceof LivingEntity livingEntity) {
                      RecoilState recoil = RecoilManager.get(livingEntity);
                      if (recoil != null) {
                          pitch += recoil.pitch();
                          yaw += recoil.yaw();
                      }
                  }

                  projectile.shootFromRotation(shooter, pitch, yaw, roll, velocity, inaccuracy);
              }
          }
          JAVA

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BodycamRealisticRecoil-Forge-1.20.1
          path: workspace/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
