
name: Build BodycamRealisticRecoil

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Locate Gradle project
        run: |
          if [ ! -f build.gradle ]; then
            echo "找不到根目录 build.gradle"
            exit 1
          fi

      - name: Build mod
        run: |
          gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BodycamRealisticRecoil-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
